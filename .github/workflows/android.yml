name: Android

# Build and test on pull requests and on main. Releases are made by the Release workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test scripts
        run: scripts/test-next-version.sh

      - name: Lint, unit tests and debug build
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      # Debug APK signed with a throwaway debug key: for trying a build, never for the store.
      - uses: actions/upload-artifact@v4
        with:
          name: documents-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
